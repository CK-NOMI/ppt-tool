<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>局部修改工作台</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><strong>局部修改工作台</strong><span>框选图片中的区域，输入修改要求</span></header>
<main><aside><label class="upload">选择图片<input id="upload" type="file" accept="image/*"></label><button id="select" disabled>框选修改</button><label for="instruction">修改要求</label><textarea id="instruction" placeholder="例如：将选中区域的背景改成浅蓝色"></textarea><button id="ai" class="primary" disabled>AI 修改选区</button><div class="pair"><button id="erase" disabled>模糊选区</button><label class="button">覆盖选区<input id="overlay" type="file" accept="image/*" disabled></label></div><label class="button">整图替换<input id="replace" type="file" accept="image/*" disabled></label><div class="pair"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button></div><a id="download" class="button muted" download="edited.png">下载图片</a><p id="status" role="status">请先选择一张图片</p></aside><section><div id="stage"><img id="image" alt="当前图片"><div id="box"></div><p id="empty">选择图片后，在这里框选要修改的区域</p></div></section></main><script src="/static/app.js"></script></body></html>
